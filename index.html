<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>Mythos Nest Control</title>

<style>
  :root {
    --bg: #0f1115;
    --panel: #1a1d24;
    --accent: #4fc3f7;
    --text: #e6e6e6;
  }

  body {
    margin: 0;
    font-family: system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: grid;
    grid-template-rows: 60px 1fr 30px;
    height: 100vh;
  }

  header {
    background: var(--panel);
    display: flex;
    align-items: center;
    padding: 0 20px;
    border-bottom: 1px solid #222;
  }

  header h1 {
    font-size: 16px;
    margin: 0;
    color: var(--accent);
  }

  main {
    display: grid;
    grid-template-columns: 250px 1fr 250px;
    height: 100%;
  }

  .panel {
    background: var(--panel);
    padding: 15px;
    border-right: 1px solid #222;
    overflow: auto;
  }

  .panel.right {
    border-left: 1px solid #222;
    border-right: none;
  }

  .workspace {
    padding: 20px;
    overflow: auto;
  }

  footer {
    font-size: 12px;
    text-align: center;
    opacity: 0.6;
  }

  button {
    background: var(--accent);
    border: none;
    padding: 8px 12px;
    margin-top: 5px;
    cursor: pointer;
    color: #000;
  }

  .log {
    font-size: 12px;
    white-space: pre-wrap;
  }
</style>
</head>

<body>

<header>
  <h1>Mythos Nest Control</h1>
</header>

<main>

  <!-- LEFT PANEL (Controls) -->
  <aside class="panel">
    <h3>Engine</h3>

    <button onclick="setEngine('api')">API Mode</button>
    <button onclick="setEngine('local')">Local Mode</button>

    <h3>Status</h3>
    <div id="status">Idle</div>

    <h3>Actions</h3>
    <button onclick="runTask()">Run Task</button>
  </aside>

  <!-- CENTER WORKSPACE (YOUR DROP ZONE) -->
  <section class="workspace" id="workspace">
    <h2>Project Workspace</h2>

    <!-- 🔥 DROP YOUR PROJECT HERE 🔥 -->
    <div id="app-root">
      <p>Your project loads here.</p>
    </div>
  </section>

  <!-- RIGHT PANEL (Logs / Debug) -->
  <aside class="panel right">
    <h3>Logs</h3>
    <div id="log" class="log"></div>
  </aside>

</main>

<footer>
  Nest Runtime · Local-first · No nonsense (mostly)
</footer>

<script>
/* ===============================
   CORE NEST STATE
================================= */

const state = {
  engine: localStorage.getItem("engine") || "api"
};

function log(msg) {
  const el = document.getElementById("log");
  el.textContent += msg + "\n";
}

function setEngine(mode) {
  state.engine = mode;
  localStorage.setItem("engine", mode);
  log("Engine switched to: " + mode);
}

/* ===============================
   TASK EXECUTION SWITCH
================================= */

async function runTask() {
  updateStatus("Running...");

  if (state.engine === "local") {
    await runLocal();
  } else {
    await runAPI();
  }

  updateStatus("Done");
}

function updateStatus(text) {
  document.getElementById("status").textContent = text;
}

/* ===============================
   ENGINE IMPLEMENTATIONS
================================= */

async function runAPI() {
  log("Calling API...");
  // placeholder
  await delay(500);
  log("API response received");
}

async function runLocal() {
  log("Running local engine...");
  // placeholder
  await delay(300);
  log("Local execution complete");
}

/* ===============================
   UTILITIES
================================= */

function delay(ms) {
  return new Promise(r => setTimeout(r, ms));
}

/* ===============================
   INIT
================================= */

log("Nest initialized");
log("Current engine: " + state.engine);

</script>

</body>
</html>
